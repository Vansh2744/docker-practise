services:
  nginx:
    image: nginx:stable-alpine3.24
    ports:
      - 4000:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
  
  server1:
    build: ./server
    environment:
      - SERVER=Server 1
    ports:
      - 3001:8000

  server2:
    build: ./server
    environment:
      - SERVER=Server 2
    ports:
      - 3002:8000

  server3:
    build: ./server
    environment:
      - SERVER=Server 3
    ports:
      - 3003:8000