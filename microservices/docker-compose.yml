version: "3.9"

services:
  nginx:
    image: nginx:stable-alpine3.24
    ports:
      - 4000:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - gateway1
      - gateway2
      - gateway3

  user-service:
    build: ./user-service
    ports:
      - "8001:8000"

  order-service:
    build: ./order-service
    ports:
      - "8002:8000"

  product-service:
    build: ./product-service
    ports:
      - "8003:8000"

  gateway1:
    build: ./gateway
    ports:
      - "3001:8000"
    environment:
      - USER_SERVICE_URL=http://user-service:8000
      - ORDER_SERVICE_URL=http://order-service:8000
      - PRODUCT_SERVICE_URL=http://product-service:8000
      - GATEWAY=GATEWAY 1
    depends_on:
      - user-service
      - order-service
      - product-service

  gateway2:
    build: ./gateway
    ports:
      - "3002:8000"
    environment:
      - USER_SERVICE_URL=http://user-service:8000
      - ORDER_SERVICE_URL=http://order-service:8000
      - PRODUCT_SERVICE_URL=http://product-service:8000
      - GATEWAY=GATEWAY 2
    depends_on:
      - user-service
      - order-service
      - product-service

  gateway3:
    build: ./gateway
    ports:
      - "3003:8000"
    environment:
      - USER_SERVICE_URL=http://user-service:8000
      - ORDER_SERVICE_URL=http://order-service:8000
      - PRODUCT_SERVICE_URL=http://product-service:8000
      - GATEWAY=GATEWAY 3
    depends_on:
      - user-service
      - order-service
      - product-service
