version: "3.9"

services:
  user-service:
    build: ./user-service
    ports:
      - "8001:8000"

  order-service:
    build: ./order-service
    ports:
      - "8002:8000"

  product-service:
    build: ./product-service
    ports:
      - "8003:8000"

  gateway:
    build: ./gateway
    ports:
      - "8000:8000"
    environment:
      - USER_SERVICE_URL=http://user-service:8000
      - ORDER_SERVICE_URL=http://order-service:8000
      - PRODUCT_SERVICE_URL=http://product-service:8000
    depends_on:
      - user-service
      - order-service
      - product-service
